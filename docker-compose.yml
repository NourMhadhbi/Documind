
services:

  # -----------------------------
  # 1. API DOCUMIND
  # -----------------------------
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile

    container_name: documind-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ollama
      OLLAMA_MODEL_NAME: qwen2.5:3b
      LLM_MAX_TOKENS: "300"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      ollama:
        condition: service_healthy

    networks:
      - documind-network

    restart: unless-stopped

  # -----------------------------
  # 2. OLLAMA - LLM
  # -----------------------------
  ollama:
    image: ollama/ollama:latest

    container_name: documind-ollama

    environment:
      OLLAMA_KEEP_ALIVE: 24h

    volumes:
      - ollama_data:/root/.ollama

    expose:
      - "11434"

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - documind-network

    restart: unless-stopped

  # -----------------------------
  # 3. PROMETHEUS - métriques (Sprint 9)
  # -----------------------------
  prometheus:
    image: prom/prometheus:v3.0.1

    container_name: documind-prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - api

    networks:
      - documind-network

    restart: unless-stopped

  # -----------------------------
  # 4. GRAFANA - dashboards (Sprint 9)
  # -----------------------------
  grafana:
    image: grafana/grafana:11.4.0

    container_name: documind-grafana

    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    networks:
      - documind-network

    restart: unless-stopped

# -----------------------------
# VOLUMES PERSISTANTS
# -----------------------------
volumes:
  ollama_data:
  huggingface_cache:
  prometheus_data:
  grafana_data:

# -----------------------------
# RESEAU INTERNE
# -----------------------------
networks:
  documind-network:
    driver: bridge
