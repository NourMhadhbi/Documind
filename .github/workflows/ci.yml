name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dÃ©pendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (faux modÃ¨les, sans Ollama)
        run: pytest tests -q

      - name: Valider le jeu de rÃ©fÃ©rence
        run: python -m benchmarks.validate_golden

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t documind-api:ci .

      - name: Smoke test (/health)
        run: |
          docker run -d --name api -p 8000:8000 documind-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API OK"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas dÃ©marrÃ©. Logs :"
          docker logs api
          exit 1

      - name: Nettoyage
        if: always()
        run: docker rm -f api || true
