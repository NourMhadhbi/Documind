[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"benchmarks/compare_cleaning.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"